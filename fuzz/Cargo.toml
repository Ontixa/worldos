[package]
name = "worldos-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MPL-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "=1.4.2", features = ["derive"] }
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.151"
worldos-kernel = { path = "../crates/worldos-kernel" }
worldos-commands = { path = "../crates/worldos-commands" }
worldos-store = { path = "../crates/worldos-store" }
worldos-engine = { path = "../crates/worldos-engine" }
worldos-capability = { path = "../crates/worldos-capability" }
worldos-rpc = { path = "../crates/worldos-rpc" }
worldos-cad = { path = "../crates/worldos-cad" }

[[bin]]
name = "requirement_expr"
path = "fuzz_targets/requirement_expr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_op_stream"
path = "fuzz_targets/state_op_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_rpc"
path = "fuzz_targets/json_rpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_protocol"
path = "fuzz_targets/plugin_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_migration"
path = "fuzz_targets/store_migration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cad_selector"
path = "fuzz_targets/cad_selector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mesh_import"
path = "fuzz_targets/mesh_import.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
