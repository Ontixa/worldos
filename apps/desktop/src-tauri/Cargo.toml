[package]
name = "worldos-desktop"
version = "0.1.0"
description = "WorldOS desktop workspace"
edition = "2021"
license = "MPL-2.0"

# Standalone workspace: Tauri build deps are heavy and desktop-only, so the
# app is excluded from the root cargo workspace.
[workspace]

[lib]
name = "worldos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worldos-engine = { path = "../../../crates/worldos-engine" }
worldos-agent = { path = "../../../crates/worldos-agent" }
worldos-kernel = { path = "../../../crates/worldos-kernel" }
