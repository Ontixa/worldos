[package]
name = "worldos-cli"
description = "worldos command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "worldos"
path = "src/main.rs"

[dependencies]
worldos-kernel = { path = "../worldos-kernel" }
worldos-commands = { path = "../worldos-commands" }
worldos-engine = { path = "../worldos-engine" }
worldos-store = { path = "../worldos-store" }
worldos-agent = { path = "../worldos-agent", features = ["llm"] }
worldos-rpc = { path = "../worldos-rpc" }
worldos-capability = { path = "../worldos-capability" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
ulid.workspace = true
time.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true
