[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldos"
version = "0.1.0"
description = "WorldOS Python SDK — drive projects through the universal command layer"
readme = "README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.10"
py-modules = ["worldos"]

[tool.setuptools]
py-modules = ["worldos"]
